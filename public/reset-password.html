<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .reset-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .reset-card p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="reset-card">

        <h2>Reset Password</h2>

        <p>
            Enter your new password below.
        </p>

        <form id="resetPasswordForm">

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script>

        const API_URL = "/api";

    const resetPasswordForm =
        document.getElementById("resetPasswordForm");

    const message =
        document.getElementById("message");


    // URL se token nikalna
    // Example:
    // http://localhost:3000/reset-password/abc123
    //                         ↑
    //                       token

    const token =
        window.location.pathname
            .split("/")
            .pop();


    resetPasswordForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // Password match check

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/password/reset-password/${token}`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                newPassword: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message ||
                        "Unable to reset password.";

                    return;
                }


                message.textContent =
                    data.message ||
                    "Password reset successfully!";


                // Form clear
                resetPasswordForm.reset();


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Something went wrong. Please try again.";
            }

        }
    );

</script>

</body>

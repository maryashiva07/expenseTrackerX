<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        padding: 20px;
    }

    .main {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .main h2 {
        text-align: center;
        margin-bottom: 10px;
        color: #1f2937;
    }

    .main > p {
        text-align: center;
        color: #6b7280;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #374151;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        margin-bottom: 18px;
    }

    input:focus {
        border-color: #6366f1;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #6366f1;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: #4f46e5;
    }

    #message {
        margin-top: 18px;
        text-align: center;
        font-size: 14px;
    }

    .main form > p:last-child {
        margin-top: 20px;
        margin-bottom: 0;
        text-align: center;
    }

    .main a {
        color: #6366f1;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .main a:hover {
        text-decoration: underline;
    }
</style>


<body>
    <div class="main">
        <h2>Forgot Password?</h2>
        <p>Enter your registered email id</p>
        <form id="forgotPasswordForm">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" placeholder="your email..." required>
              <button type="submit">Send Reset Link</button>
              <p id="message"></p>

              <p>
                 <a href="login.html">Back to Login</a>
              </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
